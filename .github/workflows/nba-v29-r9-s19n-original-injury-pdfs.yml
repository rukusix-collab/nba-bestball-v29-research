name: NBA V2.9 R9-S19N nine original injury PDFs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-v29-r9-s19n-pdfs
  cancel-in-progress: false

jobs:
  original-injury-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download nine original NBA PDF response bodies with HTTP receipts
        shell: bash
        run: |
          python - <<'PY'
          import datetime, hashlib, json, pathlib, time, urllib.request, urllib.parse, sys
          host='ak-static.cms.nba.com'
          out=pathlib.Path('original-injury-pdf-receipts')
          out.mkdir(exist_ok=True)
          dates=('2024-11-12','2024-11-15','2024-11-19')
          vintages=('01PM','04PM','06PM')
          records=[]
          def now():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()
          for day in dates:
              for vintage in vintages:
                  name=f'Injury-Report_{day}_{vintage}.pdf'
                  url=f'https://{host}/referee/injury/{name}'
                  started=now()
                  try:
                      req=urllib.request.Request(url,headers={'Accept':'application/pdf','User-Agent':'NBA-V29-Source-Custody/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as response:
                          status=response.status
                          final=response.geturl()
                          headers=list(response.headers.items())
                          raw=response.read()
                      if status!=200: raise ValueError(f'HTTP {status}')
                      if urllib.parse.urlparse(final).hostname!=host: raise ValueError('Publisher host redirect')
                      if not raw.startswith(b'%PDF-') or len(raw)<1000 or b'%%EOF' not in raw[-2048:]:
                          raise ValueError('Invalid PDF magic, size, or trailing EOF')
                      hdr={k.lower():v for k,v in headers}
                      if hdr.get('content-length') and int(hdr['content-length'])!=len(raw):
                          raise ValueError('HTTP Content-Length mismatch')
                      path=out/name
                      with path.open('xb') as f: f.write(raw)
                      receipt={'filename':name,'source_url':url,'final_url':final,'http_status':status,
                               'request_start_utc':started,'request_finish_utc':now(),
                               'response_headers':headers,'body_sha256':hashlib.sha256(raw).hexdigest(),
                               'body_byte_count':len(raw),'source_publisher_original_bytes_direct_get':True,
                               'independently_witnessed_timestamp':False,
                               'report_text_validated':False,
                               'training_admitted':False}
                      (out/(name+'.receipt.json')).write_text(json.dumps(receipt,indent=2,sort_keys=True))
                      records.append({'filename':name,'status':'LOCAL_ORIGINAL_BYTES_RECEIPT',
                                      'sha256':receipt['body_sha256'],'bytes':len(raw)})
                  except Exception as error:
                      records.append({'filename':name,'status':'FAILED','error':f'{type(error).__name__}: {error}'})
                  time.sleep(1.5)
          completed=sum(x['status']=='LOCAL_ORIGINAL_BYTES_RECEIPT' for x in records)
          summary={'run_count_requested':9,'local_original_bytes_validated':completed,
                   'failed':9-completed,'records':records,'independent_timestamp_witness':False,
                   'official_printed_vintage_checked':False,'production_admitted':False}
          (out/'CAPTURE_SUMMARY.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          sys.exit(0 if completed==9 else 1)
          PY
      - name: Preserve even incomplete PDF acquisition receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-v29-s19k-pdf-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: original-injury-pdf-receipts/
          if-no-files-found: warn
          retention-days: 30
